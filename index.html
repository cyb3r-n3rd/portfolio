<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shivam Verma — cyb3r_n3rd</title>
<meta name="description" content="Shivam Verma (cyb3r_n3rd), security researcher. An interactive 3D portfolio: a little neon stall floating in the dark.">
<meta name="theme-color" content="#07060d">
<meta property="og:title" content="Shivam Verma — cyb3r_n3rd">
<meta property="og:description" content="Security researcher. Pull up a stool.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

}
</script>
<!-- Fetch every module up front, in parallel, instead of discovering them one import at a time. -->
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" crossorigin>

<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/UnrealBloomPass.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/OutputPass.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/Pass.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/MaskPass.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/shaders/CopyShader.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/shaders/LuminosityHighPassShader.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/shaders/OutputShader.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/geometries/RoundedBoxGeometry.js" crossorigin>
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/world.js">
<link rel="modulepreload" href="js/textures.js">
<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/content.js">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>

<!-- Loading + start gate -->
<div class="gate" id="gate">
  <div class="gate-inner">
    <p class="gate-handle">cyb3r_n3rd</p>
    <div class="gate-bar" id="gate-bar"><i id="gate-fill"></i></div>
    <button type="button" class="gate-start" id="gate-start" hidden>Start</button>
    <p class="gate-note" id="gate-note">loading…</p>
  </div>
</div>

<header class="hud" id="hud">
  <a class="brand" href="#" data-home>
    <span class="brand-name">Shivam Verma</span>
    <span class="brand-role">Security Researcher</span>
  </a>
  <nav aria-label="Sections">
    <a href="#about" data-open="about">About</a>
    <a href="#projects" data-open="projects">Projects</a>
    <a href="#research" data-open="research">Research</a>
    <a href="#contact" data-open="contact">Contact</a>
  </nav>
</header>

<p class="hint" id="hint"><span>drag to look around</span><span>click a sign</span></p>

<!-- The screen UIs. js/ui.js fills these from js/content.js and main.js
     pins the active one over the matching 3D screen. -->
<div class="ui" id="ui" aria-live="polite"></div>

<noscript>
  <div class="noscript">
    <h1>Shivam Verma · cyb3r_n3rd</h1>
    <p>Security researcher. This portfolio is an interactive 3D scene and needs JavaScript.</p>
    <p><a href="https://github.com/cyb3r-n3rd">github.com/cyb3r-n3rd</a></p>
  </div>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
